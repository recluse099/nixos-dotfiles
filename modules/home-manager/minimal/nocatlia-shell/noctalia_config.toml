[bar.main]
center = []
end = [
    "group:g1",
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_scale = 1.1099999826401472
margin_ends = 0
padding = 17
position = "top"
scale = 1.1500000096857548
start = [ "launcher", "workspaces", "date", "clock", "caffeine", "nightlight" ]
thickness = 40
widget_spacing = 16

    [[bar.main.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "temp", "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

[dock]
active_monitor_only = true
auto_hide = true
enabled = true
position = "bottom"
reserve_space = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/nix/store/l8mdf9jvz7l7qynfvajjiahzf0b23cqp-noctalia-5.4.1/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/nix/store/l8mdf9jvz7l7qynfvajjiahzf0b23cqp-noctalia-5.4.1/share/noctalia/assets/noctalia-wallpaper.png"

[weather]
enabled = false

[widget.media]
hide_when_no_media = true

[widget.ram]
stat = "ram_pct"
